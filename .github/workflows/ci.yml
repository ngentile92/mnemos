name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "gateway[dev]"
      - run: pytest -q gateway/tests
      - name: example skills are valid
        run: python examples/skills/scripts/validate.py examples/skills
  lint-shell-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/*.sh skills-sync/sync.sh
      - name: compose config (dummy values)
        run: |
          cp .env.example .env && touch cognee.env
          sed -i 's/__GENERAR__/x/; s/__COMPLETAR__/x/' .env
          docker compose config -q
          docker compose -f compose.dev.yaml config -q
  linux-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # system python on purpose: the setup-python build needs LD_LIBRARY_PATH, which systemd units do not get
      - name: install path (README "Try it locally" venv)
        run: /usr/bin/python3 -m venv .venv && .venv/bin/pip install -q -e gateway
      - name: render systemd units and verify them
        run: |
          scripts/install_systemd_units.sh --dry-run --dir "$RUNNER_TEMP/units" > /dev/null
          ls "$RUNNER_TEMP/units"
          systemd-analyze verify --man=no "$RUNNER_TEMP"/units/*.timer "$RUNNER_TEMP"/units/mnemos-dashboard.service
      - name: real user units (dashboard + watchdog timer) under systemd --user
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for i in $(seq 20); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          scripts/install_systemd_units.sh --only dashboard,watchdog
          for i in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8790/ && break; sleep 1; done
          curl -fs http://127.0.0.1:8790/api/status > /dev/null
          systemctl --user list-timers 'mnemos-*' --no-pager | grep -q mnemos-watchdog.timer
          scripts/dashboard.sh restart
          scripts/install_systemd_units.sh --only dashboard,watchdog --uninstall
          ! systemctl --user is-active mnemos-dashboard.service
      - name: diagnostics
        if: failure()
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user status 'mnemos-*' --no-pager || true
          tail -50 ~/.local/state/mnemos/*.log || true
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the full history, not just the last commit
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --verbose --exit-code 1

  mcpb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: astral-sh/setup-uv@v6
      - name: build the Claude Desktop bundle (pinned to this commit)
        run: scripts/build_mcpb.sh "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: launch it like Claude Desktop does and call the tools over stdio
        run: |
          mkdir /tmp/mx && cd /tmp/mx && unzip -q "$GITHUB_WORKSPACE/dist/mnemos.mcpb"
          python3 -m venv /tmp/probe && /tmp/probe/bin/pip install -q fastmcp
          sed -e 's#/tmp/mx-home#/tmp/mxh#; s#/tmp/mx-uvcache#/tmp/mxc#' "$GITHUB_WORKSPACE/scripts/mcpb_probe.py" > /tmp/probe.py
          /tmp/probe/bin/python /tmp/probe.py | tee /tmp/out.txt
          grep -q "search hits 1" /tmp/out.txt

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: bundle a relocatable Python with mnemos-hub preinstalled (no uv needed by users)
        run: desktop/scripts/bundle_python.sh gateway
      - name: build unsigned macOS app + dmg (no Apple signing yet)
        working-directory: desktop
        run: npx -y @tauri-apps/cli@2 build --bundles app,dmg --config src-tauri/tauri.bundle.conf.json
      - name: smoke test the packaged app without uv or Python on PATH
        run: |
          set -x
          APP=desktop/src-tauri/target/release/bundle/macos/Mnemos.app
          PY="$APP/Contents/Resources/python/bin/python3"
          test -x "$PY"
          for u in $(which -a uv 2>/dev/null); do sudo rm -f "$u"; done
          rm -f ~/.local/bin/uv ~/.cargo/bin/uv
          export HOME_T="$RUNNER_TEMP/mnemos-home"
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$PY" -I -m hub_gateway.local init --home "$HOME_T" --contexts personal,work
          # launch the real app binary; MNEMOS_AUTOSTART makes it start the hub with its bundled runtime
          env -i HOME="$HOME" PATH=/usr/bin:/bin MNEMOS_HOME="$HOME_T" MNEMOS_AUTOSTART=1 MNEMOS_NO_KEYCHAIN=1 \
            "$(ls -d "$APP"/Contents/MacOS/* | head -1)" > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8765/ | grep -q "Mnemos is running" && break; sleep 2; done
          curl -fs http://127.0.0.1:8765/ | grep "Mnemos is running"
          ps aux | grep -v grep | grep "Resources/python/bin/python3 -I -m hub_gateway.local serve"
          curl -fs http://127.0.0.1:8765/app | grep "My memory"
          curl -fs http://127.0.0.1:8765/ui/memory.js > /dev/null
          TOK=$(cat "$HOME_T/token")
          curl -fs -X POST http://127.0.0.1:8765/personal/mcp -H "Authorization: Bearer $TOK" \
            -H "Accept: application/json, text/event-stream" -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | grep serverInfo
          cat "$HOME_T/hub.log" "$RUNNER_TEMP/app.log" || true
          pkill -f "Mnemos.app/Contents/MacOS" || true
      - name: package artifact (zip keeps the .app bundle intact)
        run: |
          mkdir -p dist
          ditto -c -k --keepParent desktop/src-tauri/target/release/bundle/macos/Mnemos.app dist/Mnemos-macos-unsigned.app.zip
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg dist/Mnemos-macos-unsigned.dmg
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: Mnemos-macos-unsigned
          path: |
            dist/Mnemos-macos-unsigned.dmg
            dist/Mnemos-macos-unsigned.app.zip
          retention-days: 14
