name: release
# Push a tag like v0.2.0 → builds the Mac app (.dmg + .app.zip) and the Claude Desktop extension (.mcpb) and
# publishes them on GitHub Releases with fixed asset names, so .../releases/latest/download/<name> always works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "existing tag to (re)publish", required: true }
permissions:
  contents: write
jobs:
  mcpb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: scripts/build_mcpb.sh "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v7
        with: { name: mcpb, path: dist/mnemos.mcpb }
  fm-helper:
    # Apple Foundation Model bridge: needs the macOS 26 SDK, so it is built here and copied into the app below.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - name: build desktop/fm-helper with the macOS 26 SDK
        run: |
          xcodebuild -version || true
          FM_HELPER_REQUIRE=1 desktop/scripts/build_fm_helper.sh
          file desktop/src-tauri/resources/fm-helper
          echo '{"prompt":"Reply {\"ok\": true}"}' | desktop/src-tauri/resources/fm-helper | head -2
      - uses: actions/upload-artifact@v7
        with: { name: fm-helper, path: desktop/src-tauri/resources/fm-helper }
  desktop:
    needs: [fm-helper]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v8
        with: { name: fm-helper, path: "${{ runner.temp }}/fm" }
      - name: bundle the Apple Intelligence helper
        run: FM_HELPER_BIN="$RUNNER_TEMP/fm/fm-helper" FM_HELPER_REQUIRE=1 desktop/scripts/build_fm_helper.sh
      - run: desktop/scripts/bundle_python.sh gateway
      - working-directory: desktop
        run: npx -y @tauri-apps/cli@2 build --bundles app,dmg --config src-tauri/tauri.bundle.conf.json
      - name: smoke test the packaged hub (no uv / Python on PATH)
        run: |
          PY=desktop/src-tauri/target/release/bundle/macos/Mnemos.app/Contents/Resources/python/bin/python3
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$PY" -I -m hub_gateway.local init --home "$RUNNER_TEMP/h" --contexts personal
      - name: ad-hoc sign the whole bundle (no Apple ID; unsigned or unsealed apps show "damaged" after a download)
        run: desktop/scripts/adhoc_sign.sh desktop/src-tauri/target/release/bundle/macos/Mnemos.app
      - run: |
          mkdir -p dist
          ditto -c -k --keepParent desktop/src-tauri/target/release/bundle/macos/Mnemos.app dist/Mnemos-macos.app.zip
          desktop/scripts/make_dmg.sh desktop/src-tauri/target/release/bundle/macos/Mnemos.app dist/Mnemos-macos.dmg
      - name: check the published files carry a valid signature
        run: |
          T=$(mktemp -d); ditto -x -k dist/Mnemos-macos.app.zip "$T" && codesign --verify --deep --strict --verbose=2 "$T/Mnemos.app"
          M=$(hdiutil attach -nobrowse -readonly dist/Mnemos-macos.dmg | awk -F'\t' '/Volumes/{print $NF}')
          codesign --verify --deep --strict --verbose=2 "$M/Mnemos.app"; codesign -dv "$M/Mnemos.app" 2>&1 | grep -E "Signature=adhoc|Sealed Resources"
          hdiutil detach "$M"
      - uses: actions/upload-artifact@v7
        with: { name: desktop, path: "dist/*" }
  publish:
    needs: [mcpb, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          git fetch -q --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG" && git checkout -q "$TAG"
          python3 scripts/check_versions.py --tag "$TAG"
          python3 scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/body.md"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Mnemos $TAG" --notes-file "$RUNNER_TEMP/body.md"
          gh release upload "$TAG" dist/Mnemos-macos.dmg dist/Mnemos-macos.app.zip dist/mnemos.mcpb --clobber
