[project]
name = "mnemos-hub"   # distribution name (PyPI/npm "mnemos-hub"); the import package stays hub_gateway
version = "0.4.0"
description = "Mnemos: one memory, skills and credentials hub for all your AI assistants, isolated by context (MCP gateway)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mnemos contributors" }]
keywords = ["mcp", "memory", "ai", "claude", "chatgpt"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = [
  "fastmcp>=4.0.10,<4.1",
  "httpx>=0.28,<0.29",
  "pyyaml>=6.0",
  "infisicalsdk>=1.0.17,<2",
  "cryptography>=44",
  "uvicorn>=0.30",
  "webauthn>=2.2,<4",
]

[project.urls]
Homepage = "https://github.com/ngentile92/mnemos"
Documentation = "https://github.com/ngentile92/mnemos/tree/main/docs"

[project.optional-dependencies]
local-ai = ["llama-cpp-python==0.3.36"]   # built-in model for local mode / Desktop (bundled in the Mac app)
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "pyflakes>=3", "soft-webauthn>=0.1.3"]

[project.scripts]
hub-gateway = "hub_gateway.app:main"   # kept: the Docker image runs it
mnemos-hub = "hub_gateway.app:main"
mnemos-router = "hub_gateway.router.server:main"
mnemos-local = "hub_gateway.local:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
hub_gateway = ["local_ui_static/*", "local_ui_static/vendor/*"]
