[package]
name = "mnemos-desktop"
version = "0.1.0"
edition = "2021"
description = "Mnemos Desktop: runs your local Mnemos hub"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
