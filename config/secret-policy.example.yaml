# Mnemos — secret injection policy per context. Copy to config/secret-policy.yaml (gitignored) and edit.
# NO VALUES here: values live in Infisical; the gateway only knows names, target hosts and how to inject.
#
# Entry format:
#   <NAME_IN_INFISICAL>:
#     project: <Infisical project slug>             (or project_id: <uuid>)
#     path: <folder>                                (default "/")
#     environment: prod                             (optional; default INFISICAL_ENVIRONMENT)
#     key: <REAL_NAME_IN_INFISICAL>                 (optional alias; default = entry name)
#     description: "what it is for"
#     allowed_hosts: ["exact.host.com"]             (no wildcards, no ports)
#     methods: ["GET"]                              (optional; default all but CONNECT/TRACE)
#     inject: { header: "Authorization", format: "Bearer {value}" }
#
# A hub-shared secret used in several contexts is repeated in each section.
# Real slugs are in Infisical → Project Settings (they usually carry a random suffix).
# The gateway loads this file at startup: restart the gateways after editing it.

work:
  OPENAI_API_KEY:
    project: hub-work
    path: /
    description: "OpenAI API (work account)"
    allowed_hosts: ["api.openai.com"]
    methods: ["GET", "POST"]
    inject: { header: "Authorization", format: "Bearer {value}" }

personal:
  # Harmless first test: a fine-grained, read-only GitHub PAT.
  GITHUB_PAT_READONLY:
    project: hub-personal
    path: /
    description: "Read-only GitHub PAT"
    allowed_hosts: ["api.github.com"]
    methods: ["GET"]
    inject: { header: "Authorization", format: "Bearer {value}" }

side:
  OPENAI_API_KEY:
    project: hub-side
    path: /shop
    description: "OpenAI API for the Shop side project"
    allowed_hosts: ["api.openai.com"]
    methods: ["GET", "POST"]
    inject: { header: "Authorization", format: "Bearer {value}" }
